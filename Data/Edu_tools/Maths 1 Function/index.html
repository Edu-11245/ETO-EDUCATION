<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maths 1 Function — رسم الدوال</title>
<link rel="stylesheet" href="../../../css/animate.min.css">
<style>
:root{--bg:#eef2f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--grid:#eef1f6;--grid2:#d5dce8;--ax:#334155;--pri:#6366f1;--cv:#fff;--in:#f8fafc;--animate-duration:.55s}
:root.dark{--bg:#0b1220;--card:#111a2e;--tx:#e5e7eb;--mut:#94a3b8;--bd:#22304a;--grid:#17233a;--grid2:#2b3d61;--ax:#cbd5e1;--cv:#0d1526;--in:#0b1424}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Segoe UI',Tahoma,system-ui,sans-serif}
.wrap{max-width:1200px;margin:auto;padding:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#312e81,#6366f1 65%,#06b6d4);color:#fff;border-radius:20px;padding:18px 20px;margin-bottom:14px;box-shadow:0 10px 30px rgba(99,102,241,.3)}
header h1{margin:0 0 4px;font-size:1.45rem;font-weight:800}
header p{margin:0;opacity:.9;font-size:.88rem}
.hr{display:flex;gap:8px;align-items:center;flex:none}
.ibtn{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:12px;width:42px;height:42px;font-size:1.15rem;cursor:pointer;flex:none;transition:.15s;font-family:inherit}
.ibtn:hover{background:rgba(255,255,255,.32)}
.ibtn.pill{width:auto;padding:0 14px;font-size:.9rem;font-weight:700;white-space:nowrap}
.ibtn:focus-visible,.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn:focus-visible{outline-color:var(--pri)}
main{display:grid;grid-template-columns:370px 1fr;gap:14px;align-items:start}
@media(max-width:880px){main{grid-template-columns:1fr}}
@media(max-width:560px){header{padding:14px}header h1{font-size:1.15rem}header p{font-size:.78rem}.ibtn{width:38px;height:38px}}
.panel,.stage{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;box-shadow:0 6px 24px rgba(15,23,42,.06)}
.h{font-size:.76rem;color:var(--mut);margin:14px 0 8px;font-weight:700}
.row{background:var(--in);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:10px}
.top{display:grid;grid-template-columns:12px auto 1fr 32px;gap:8px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.top label{font-size:.85rem;color:var(--mut);direction:ltr;white-space:nowrap}
.ig{position:relative;border:1.5px solid var(--bd);border-radius:10px;background:var(--card);transition:.15s}
.ig:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px rgba(99,102,241,.16)}
.row.bad .ig{border-color:#ef4444}
.ig input,.ghost{padding:10px 12px;font:17px/24px 'Cambria Math','Segoe UI Symbol','Segoe UI',system-ui,sans-serif;direction:ltr;text-align:left}
.ig input{position:relative;width:100%;border:0;background:transparent;color:var(--tx);outline:0;min-width:0}
.ghost{position:absolute;inset:0;white-space:pre;overflow:hidden;pointer-events:none}
.ghost i{visibility:hidden;font-style:normal}
.ghost b{font-weight:400;color:var(--mut);opacity:.65}
.sub{min-height:22px;margin-top:8px;font-size:.82rem;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sub .er{color:#ef4444}
.sg{border:1px solid var(--pri);background:transparent;color:var(--pri);border-radius:8px;padding:2px 9px;font:13px Consolas,monospace;cursor:pointer;direction:ltr}
.sg:hover{background:var(--pri);color:#fff}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;font-size:.85rem;transition:.15s}
.btn:hover{border-color:var(--pri);transform:translateY(-1px)}
.btn:active{transform:none}
.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.x{padding:6px;color:#ef4444}
.row.pw .ig{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.18)}
.hint{color:#b45309;background:rgba(245,158,11,.14);border-radius:8px;padding:3px 10px}
#pow.on{background:#f59e0b;color:#fff;border-color:#f59e0b}
.hl{display:flex;align-items:center;gap:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .btn{direction:ltr;font-family:'Cambria Math','Segoe UI Symbol','Segoe UI',sans-serif;font-size:1.05rem}
.qs{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}

.qs .q sub,.qs .q sup{font-size:.62em}
.cvw{position:relative}
canvas{width:100%;height:min(72vh,660px);min-height:340px;display:block;border-radius:14px;background:var(--cv);border:1px solid var(--bd);touch-action:none;cursor:grab}
.fab{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.fab .btn{width:38px;height:38px;padding:0;border-radius:12px;font-size:1.05rem;box-shadow:0 4px 12px rgba(15,23,42,.12)}
#info{margin-top:10px;font-size:.88rem;min-height:36px;padding:8px 12px;border-radius:12px;background:var(--in);border:1px solid var(--bd);unicode-bidi:plaintext}
#info span{margin-inline-start:14px;font-family:Consolas,monospace;font-weight:700}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.tools .grow{margin-inline-start:auto}
.shr{background:linear-gradient(135deg,#6366f1,#06b6d4);color:#fff;border-color:transparent}
.shr:hover{border-color:transparent;filter:brightness(1.07)}

.prm label{font:italic 17px Georgia,serif;color:var(--pri);text-align:center}
.prm input[type=range]{width:100%;accent-color:var(--pri)}

.prm .btn{padding:6px 0}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov[hidden]{display:none}

@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.dlg{animation:none}}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:800}
.dlg img{width:100%;display:block;border-radius:12px;border:1px solid var(--bd);margin-bottom:12px}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dg .btn{padding:10px 8px}
.soc{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.soc a:hover{border-color:var(--pri);color:var(--pri)}
.note{font-size:.76rem;color:var(--mut);margin:10px 0 0;line-height:1.6}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ax);color:var(--cv);padding:10px 18px;border-radius:12px;font-size:.88rem;opacity:0;pointer-events:none;transition:.25s;z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>

    <div class="dg">

<script>
const $=s=>document.querySelector(s);
const COL=['#6366f1','#ef4444','#10b981','#f59e0b','#06b6d4'];
const BRAND='ETO';

const I18N={
ar:{
  doc:'Maths 1 Function — رسم الدوال',title:'رسم الدوال',
  sub:'اكتب الدالة وشوفها بتترسم قدامك. اسحب للتحريك وكبّر بالعجلة أو بصباعين.',
  back:'رجوع للموقع',theme:'تبديل الثيم',langBtn:'🌐 English',langTitle:'Switch to English',
  functions:'الدوال',add:'＋ إضافة دالة',pow:'xⁿ  أُس',powTitle:'أُس',
  quick:'رموز سريعة',
  q_abs:'قيمة مطلقة |x|',q_sqrt:'جذر تربيعي',q_root:'جذر نوني — root(n, x)',q_log:'لوغاريتم أساس 10',q_ln:'لوغاريتم طبيعي',q_logb:'لوغاريتم بأساس تختاره — log(x, a)',q_pi:'باي π',
  params:'المعاملات — حرّك المنزلق وشوف الرسم بيتغير',auto:'تحريك تلقائي',
  examples:'أمثلة جاهزة',zin:'تكبير',zout:'تصغير',zreset:'ضبط العرض',
  kp:'◎ النقاط المهمة',kpTitle:'جذور وقمم وتقاطعات',
  der:'f′ المشتقة',derTitle:'ارسم المشتقة بخط متقطع',
  tan:'╱ مماس',tanTitle:'مماس عند مكان الماوس',
  play:'▶ إعادة الرسم',png:'⬇ حفظ صورة',share:'⤴ مشاركة',
  ph:'مثال: x² + sin(x) أو ax²+bx+c',del:'حذف',
  pwHint:'✍ بتكتب الأُس… اضغط → أو + أو مسافة علشان تخرج منه',
  idle:'حرّك الماوس أو المس الرسم علشان تقرأ قيم الدوال',undef:'غير معرّفة',
  noFn:n=>`الدالة "${n}" مش موجودة`,
  parens:n=>`اكتب ${n} بأقواس، مثل ${n}(x)`,
  unk:n=>`الرمز "${n}" مش معروف. المتغير x والمعاملات a b c d k m`,
  unsup:'الصيغة دي مش مدعومة',
  bad:'المعادلة مش مكتملة أو فيها خطأ في الكتابة',
  bars:'علامتا القيمة المطلقة | | لازم تتقفل',
  nomath:'⚠ مكتبة math.js مش اتحملت. اتأكد إن الملف موجود في Data/lib/math.js',
  k_r:'جذر',k_max:'قمة',k_min:'قاع',cross:(a,b)=>`تقاطع f${a} و f${b}`,
  shareTitle:'مشاركة الرسم',close:'إغلاق',dl:'⬇ تحميل الصورة',copyImg:'نسخ الصورة',copyLink:'نسخ الرابط',nativeShare:'مشاركة…',
  shareNote:'واتساب وتيليجرام وباقي الروابط بتشارك النص والرابط بس. لو عايز الصورة نفسها: حمّلها أو انسخها وألصقها في المحادثة.',
  shareText:l=>`رسم الدوال: ${l}`,
  rights:'جميع الحقوق محفوظة',
  saved:'تم حفظ الصورة ✓',copied:'تم النسخ ✓',copyFail:'مقدرتش أنسخ، جرّب التحميل'
},
en:{
  doc:'Maths 1 Function — Function Grapher',title:'Function Grapher',
  sub:'Type a function and watch it plot. Drag to pan, zoom with the wheel or two fingers.',
  back:'Back to site',theme:'Toggle theme',langBtn:'🌐 العربية',langTitle:'التبديل إلى العربية',
  functions:'Functions',add:'＋ Add function',pow:'xⁿ  Power',powTitle:'Exponent',
  quick:'Quick symbols',
  q_abs:'Absolute value |x|',q_sqrt:'Square root',q_root:'nth root — root(n, x)',q_log:'Logarithm, base 10',q_ln:'Natural logarithm',q_logb:'Logarithm with your own base — log(x, a)',q_pi:'Pi π',
  params:'Parameters — drag a slider to see the graph change',auto:'Auto-animate',
  examples:'Examples',zin:'Zoom in',zout:'Zoom out',zreset:'Reset view',
  kp:'◎ Key points',kpTitle:'Roots, extrema and intersections',
  der:'f′ Derivative',derTitle:'Draw the derivative as a dashed line',
  tan:'╱ Tangent',tanTitle:'Tangent at the cursor',
  play:'▶ Replay',png:'⬇ Save image',share:'⤴ Share',
  ph:'e.g. x² + sin(x) or ax²+bx+c',del:'Delete',
  pwHint:'✍ Typing an exponent… press →, + or space to leave it',
  idle:'Hover or touch the graph to read function values',undef:'undefined',
  noFn:n=>`Function "${n}" doesn't exist`,
  parens:n=>`Write ${n} with parentheses, e.g. ${n}(x)`,
  unk:n=>`Unknown symbol "${n}". Use x and the parameters a b c d k m`,
  unsup:"This syntax isn't supported",
  bad:'The expression is incomplete or has a typo',
  bars:'Absolute-value bars | | must be closed',
  nomath:'⚠ math.js failed to load. Make sure the file exists at Data/lib/math.js',
  k_r:'Root',k_max:'Max',k_min:'Min',cross:(a,b)=>`f${a} ∩ f${b}`,
  shareTitle:'Share graph',close:'Close',dl:'⬇ Download image',copyImg:'Copy image',copyLink:'Copy link',nativeShare:'Share…',
  shareNote:'WhatsApp, Telegram and the other links share the text and link only. To send the image itself, download or copy it and paste it into the chat.',
  shareText:l=>`Function graph: ${l}`,
  rights:'All rights reserved',
  saved:'Image saved ✓',copied:'Copied ✓',copyFail:"Couldn't copy — try downloading"
}};
let LANG='ar';
const L=(k,...a)=>{const v=I18N[LANG][k];return typeof v==='function'?v(...a):v};

const FN=['sin','cos','tan','cot','sec','csc','asin','acos','atan','sinh','cosh','tanh','sqrt','cbrt','root','abs','exp','ln','log','floor','ceil','round','sign'];
const CONST=['pi','e'];
const EX=['sin(x)','x^2','x^3-3x','1/x','sqrt(x)','|x-2|','root(3,x)','e^x','ln(x)','log(x,2)','tan(x)','sin(x)/x','ax^2+bx+c','a*sin(bx)'];
const sc={x:0,ln:Math.log,
  log:(x,b)=>b===undefined?Math.log10(x):Math.log(x)/Math.log(b),
  root:(n,x)=>n===0?NaN:(x<0&&Number.isInteger(n)&&n%2!==0?-Math.pow(-x,1/n):Math.pow(x,1/n))};
const PARAMS=['a','b','c','d','k','m'],PX=PARAMS.concat('x'),P={};
PARAMS.forEach(p=>{P[p]={v:1,min:-5,max:5,run:0,dir:1};sc[p]=1});
const fmt=n=>String(parseFloat(n.toPrecision(5)));
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const cv=$('#cv'),g=cv.getContext('2d');
let fns=[],view={cx:0,cy:0,s:60},prog=1,raf=0,hover=null,focusIn=null,W=0,H=0,dpr=1,tm=0;
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;

function check(node){
  let bad='';
  node.traverse((n,path,parent)=>{
    if(bad)return;
    if(n.type==='FunctionNode'){if(!FN.includes(n.name))bad=L('noFn',n.name)}
    else if(n.type==='SymbolNode'){
      if(parent&&parent.type==='FunctionNode'&&path==='fn')return;
      if(FN.includes(n.name))bad=L('parens',n.name);
      else if(n.name!=='x'&&!CONST.includes(n.name)&&!PARAMS.includes(n.name))bad=L('unk',n.name);
    }else if(!['ConstantNode','OperatorNode','ParenthesisNode'].includes(n.type))bad=L('unsup');
  });
  return bad;
}
function norm(s){
  s=s.replace(/√\s*\(/g,'sqrt(').replace(/∛\s*\(/g,'cbrt(')
     .replace(/([√∛])\s*([a-z0-9.]+)/gi,(m,c,a)=>(c==='√'?'sqrt(':'cbrt(')+a+')');
  let open=false,r='';
  for(const c of s){if(c==='|'){r+=open?')':'abs(';open=!open}else r+=c}
  return open?null:r;
}
function comp(f){
  f.code=null;f.err='';f.used=[];
  let t=f.expr.trim().toLowerCase().replace(SUPRE,m=>'^('+[...m].map(c=>UNSUP[c]).join('')+')').replace(/^(y|f\(x\))\s*=\s*/,'').replace(/[×·]/g,'*').replace(/÷/g,'/');
  t=norm(t);
  if(t===null){f.err=L('bars');return}
  t=t.replace(/[a-z]+(\s*\()?/g,(m,p)=>{const w=p?m.slice(0,m.length-p.length):m;return FN.includes(w)||CONST.includes(w)||![...w].every(c=>PX.includes(c))?m:[...w].join('*')+(p?'*(':'')});
  if(!t)return;
  try{
    const n=math.parse(t),bad=check(n);
    if(bad){f.err=bad;return}
    f.code=n.compile();sc.x=1;f.code.evaluate(sc);
    f.used=n.filter(q=>q.type==='SymbolNode'&&PARAMS.includes(q.name)).map(q=>q.name);
  }catch(e){f.code=null;f.err=L('bad')}
}
function ev(f,x){try{sc.x=x;const v=f.code.evaluate(sc);return typeof v==='number'?v:NaN}catch(e){return NaN}}
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','(':'⁽',')':'⁾','x':'ˣ','n':'ⁿ','/':'⁄','.':'˙'};
const UNSUP=Object.fromEntries(Object.entries(SUP).map(([a,b])=>[b,a]));
const SUPRE=/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻⁽⁾ˣⁿ⁄˙]+/g;
const isSup=c=>!!c&&(c in UNSUP);
const toSup=t=>[...t].map(c=>SUP[c]||c).join('');
const disp=t=>t.replace(/\^(\([^()]*\)|[+-]?[0-9xn.]+)/g,(_,a)=>toSup(a));

    const y0=ev(f,hover),m=dv(f,hover);
    if(!isFinite(y0+m)||Math.abs(m)>1e4)return;
    g.strokeStyle=COL[f.color];g.beginPath();
    g.moveTo(0,Y(y0+m*(xl-hover)));g.lineTo(W,Y(y0+m*(xr-hover)));g.stroke();
  });
  g.globalAlpha=1;
}
function exportCanvas(){
  const h=hover,hp=hpy;hover=null;hpy=null;cancelAnimationFrame(raf);prog=1;draw();
  const C={card:cssv('--card'),tx:cssv('--tx'),mut:cssv('--mut')};
  const k=dpr,fh=Math.round(64*k),c=document.createElement('canvas');
  c.width=cv.width;c.height=cv.height+fh;
  const x=c.getContext('2d');
  x.drawImage(cv,0,0);
  hover=h;hpy=hp;draw();
  x.fillStyle=C.card;x.fillRect(0,cv.height,c.width,fh);
  const gr=x.createLinearGradient(0,0,c.width,0);
  gr.addColorStop(0,'#312e81');gr.addColorStop(.65,'#6366f1');gr.addColorStop(1,'#06b6d4');
  x.fillStyle=gr;x.fillRect(0,cv.height,c.width,Math.max(2,Math.round(3*k)));
  x.scale(k,k);
  const Wc=c.width/k,y0=cv.height/k,ff='"Segoe UI",Tahoma,system-ui,sans-serif';
  x.textBaseline='middle';x.textAlign='left';x.direction='ltr';
  x.font='600 13px '+ff;
  let px=14;const ly=y0+27;
  for(let i=0;i<fns.length;i++){
    const f=fns[i];if(!f.code)continue;
    const label='f'+(i+1)+'(x) = '+disp(f.expr.trim().replace(/^(y|f\(x\))\s*=\s*/i,''));
    const w=x.measureText(label).width+22;
    if(px+w>Wc-14){x.fillStyle=C.mut;x.fillText('…',px,ly);break}
    x.fillStyle=COL[f.color];x.beginPath();x.arc(px+5,ly,4.5,0,7);x.fill();
    x.fillStyle=C.tx;x.fillText(label,px+16,ly);px+=w+14;
  }
  const ry=y0+49;
  x.font='11.5px '+ff;x.fillStyle=C.mut;
  x.textAlign='left';x.direction='ltr';
  x.fillText('© '+new Date().getFullYear()+' '+BRAND,14,ry);
  x.textAlign='right';x.direction=LANG==='ar'?'rtl':'ltr';
  x.fillText(L('rights'),Wc-14,ry);
  return c;
}
function toBlob(c){
  const u=c.toDataURL('image/png'),b=atob(u.split(',')[1]),a=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);
  return new Blob([a],{type:'image/png'});
}
let shareBlob=null,shareFile=null,pvUrl='';
function prep(){
  shareBlob=toBlob(exportCanvas());
  try{shareFile=new File([shareBlob],'function-graph.png',{type:'image/png'})}catch(e){shareFile=null}
}
function download(){
  const l=document.createElement('a'),u=URL.createObjectURL(shareBlob);
  l.href=u;l.download='function-graph.png';document.body.appendChild(l);l.click();l.remove();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function shareURL(){
  const p=new URLSearchParams();
  fns.forEach(f=>{if(f.expr.trim())p.append('f',f.expr.trim())});
  p.set('v',[view.cx,view.cy,view.s].map(n=>+n.toPrecision(5)).join(','));
  return /^https?:/.test(location.protocol)?location.href.split('#')[0]+'#'+p:'';
}
function loadHash(){
  if(!location.hash)return false;
  try{
    const p=new URLSearchParams(location.hash.slice(1)),fs=p.getAll('f').slice(0,5);
    if(!fs.length)return false;
    fns=fs.map((e,i)=>({expr:e,color:i,code:null,err:'',show:true}));
    const v=(p.get('v')||'').split(',').map(Number);
    if(v.length===3&&v.every(isFinite)&&v[2]>=2&&v[2]<=4000)view={cx:v[0],cy:v[1],s:v[2]};
    return true;
  }catch(e){return false}
}
function shareData(){
  const list=fns.map((f,i)=>f.code?'f'+(i+1)+'(x) = '+disp(f.expr.trim()):'').filter(Boolean).join('  |  ');
  return{url:shareURL(),text:L('shareText',list)};
}
let tt=0;
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
async function copyText(s){
  try{await navigator.clipboard.writeText(s);toast(L('copied'))}
  catch(e){
    try{const t=document.createElement('textarea');t.value=s;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?L('copied'):L('copyFail'))}
    catch(e2){toast(L('copyFail'))}
  }
}
async function doShare(){
  prep();                      
  const d=shareData();
  if(shareFile&&navigator.canShare&&navigator.canShare({files:[shareFile]})){
    try{await navigator.share({files:[shareFile],title:L('title'),text:d.text+(d.url?'\n'+d.url:'')});return}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  openDlg(d);
}
let lastFocus=null;
function openDlg(d){
  lastFocus=document.activeElement;
  if(pvUrl)URL.revokeObjectURL(pvUrl);
  pvUrl=URL.createObjectURL(shareBlob);$('#pv').src=pvUrl;
  const msg=encodeURIComponent(d.text+(d.url?'\n'+d.url:'')),u=encodeURIComponent(d.url);
  $('#s-wa').href='https://wa.me/?text='+msg;
  $('#s-tg').href='https://t.me/share/url?url='+u+'&text='+encodeURIComponent(d.text);
  $('#s-x').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(d.text)+(d.url?'&url='+u:'');
  $('#s-fb').href='https://www.facebook.com/sharer/sharer.php?u='+u;
  $('#s-fb').hidden=!d.url;
  $('#s-nat').hidden=!navigator.share;
  $('#s-ci').hidden=!(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write);
  $('#s-cl').onclick=()=>copyText(d.url||d.text);
  $('#s-nat').onclick=()=>{navigator.share({title:L('title'),text:d.text,url:d.url||undefined}).catch(()=>{})};
  $('#ov').hidden=false;$('#s-dl').focus();
}
function closeDlg(){
  $('#ov').hidden=true;
  if(pvUrl){URL.revokeObjectURL(pvUrl);pvUrl=''}
  if(lastFocus&&lastFocus.focus)lastFocus.focus();
}
$('#dx').onclick=closeDlg;
$('#ov').addEventListener('mousedown',e=>{if(e.target===$('#ov'))closeDlg()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden)closeDlg()});
$('#s-dl').onclick=()=>{download();toast(L('saved'))};
$('#s-ci').onclick=async()=>{
  try{await navigator.clipboard.write([new ClipboardItem({'image/png':shareBlob})]);toast(L('copied'))}
  catch(e){toast(L('copyFail'))}
};
function setTheme(d,save){
  document.documentElement.classList.toggle('dark',d);$('#theme').textContent=d?'☀️':'🌙';
  if(save){try{localStorage.setItem('eto-math-theme',d?'dark':'light')}catch(e){}}
  draw();
}
$('#theme').onclick=()=>setTheme(!document.documentElement.classList.contains('dark'),true);
let saved='light';try{saved=localStorage.getItem('eto-math-theme')||'light'}catch(e){}
function applyLang(){
  const d=document.documentElement;d.lang=LANG;d.dir=LANG==='ar'?'rtl':'ltr';
  document.title=L('doc');
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=L(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-title]').forEach(e=>e.title=L(e.dataset.i18nTitle));
  $('#lang').textContent=L('langBtn');
  $('#back').textContent=LANG==='ar'?'→':'←';
}
function setLang(l,save){
  LANG=l;
  if(save){try{localStorage.setItem('eto-math-lang',l)}catch(e){}}
  applyLang();
  if(typeof math!=='undefined'){fns.forEach(comp);rows();pkey='';syncParams();info();draw()}
  else $('#info').textContent=L('nomath');
}
$('#lang').onclick=()=>setLang(LANG==='ar'?'en':'ar',true);
$('#add').onclick=()=>{const f=addFn();if(f)f._row.querySelector('input').focus()};
$('#pow').onclick=()=>{const i=focusIn&&document.body.contains(focusIn)?focusIn:[...document.querySelectorAll('#rows input')].pop();if(i){i.focus();i._pw()}};
$('#back').onclick=()=>{if(history.length>1)history.back();else location.href='../../../index.html'};
new ResizeObserver(size).observe(cv);
setTheme(saved==='dark',false);
let sl0='ar';try{sl0=localStorage.getItem('eto-math-lang')||'ar'}catch(e){}
LANG=sl0==='en'?'en':'ar';
if(LANG==='en'){
  $('#panel').classList.replace('animate__fadeInRight','animate__fadeInLeft');
  $('#stage').classList.replace('animate__fadeInLeft','animate__fadeInRight');
}
applyLang();
EX.forEach(t=>{const b=document.createElement('button');b.className='btn animate__animated animate__bounceIn';b.textContent=disp(t);b.onclick=()=>useExample(t);$('#chips').appendChild(b)});
if(typeof math==='undefined'){
  $('#info').textContent=L('nomath');
}else{
  if(!loadHash())fns=[{expr:'sin(x)',color:0}];
  fns.forEach(f=>{f.show=true;comp(f)});rows();info();
  requestAnimationFrame(()=>{size();play()});
}
</script>
