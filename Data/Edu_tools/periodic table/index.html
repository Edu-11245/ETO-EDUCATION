<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Periodic Table</title>
  <link rel="stylesheet" href="../css/animate.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bd: #cbd5e1;
      --ink: #0f172a;
      --mu: #64748b;
      --teal: #0e8a8a;
      --navy: #0b2545;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f8fafc;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--navy);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--teal);
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 16px;
      background: #f8fafc;
      color: var(--ink);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
      max-width: 100%;
    }

    #main-content {
      max-width: 100%;
    }

    /* تنسيق زر الرجوع للرئيسية */
    .back-container {
      max-width: 1200px;
      margin: 0 auto 15px auto;
      padding: 0 10px;
    }
    .back-to-site-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--navy);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .back-to-site-btn:hover {
      background-color: var(--teal);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(14,138,138,0.2);
    }

    @media (max-width: 960px) {
      body { padding: 12px; }
      .pt-wrap { padding: 0 !important; }
      .pt-grid {
        min-width: 750px !important; 
        gap: 3px !important; 
      }
      .pt-s { font-size: 15px !important; }
      .pt-cell { padding: 2px !important; }
    }
    .pagehead { 
      text-align: center; 
      margin-bottom: 25px; 
      padding: 20px;
      background: linear-gradient(135deg, var(--navy), #1d4e89);
      color: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .pagehead h2 { 
      margin: 0 0 10px; 
      font-size: 2.2rem;
      color: #fff;
    }
    .pagehead p { 
      margin: 0; 
      color: #cbd5e1; 
      font-size: 1.1rem;
    }

    .en { display: block; font-size: 0.85em; opacity: 0.85; }
    .ar { display: block; }
    
    .pt-cell {
      animation: zoomIn 0.5s ease-out both;
    }
  </style>
</head>
<body data-l="both">

  <!-- زر الرجوع للرئيسية -->
  <div class="back-container">
    <a href="../../../index.html" class="back-to-site-btn">
      <i class="fa-solid fa-arrow-right"></i> الرجوع للرئيسية
    </a>
  </div>

  <div id="main-content" class="animate__animated animate__fadeIn"></div>

  <script>
    window.bi = function(obj) {
      if (!obj) return '';
      if (typeof obj === 'string') return obj;
      return `<span class="ar">${obj.ar || ''}</span><span class="en">${obj.en || ''}</span>`;
    };
  </script>
  
  <script src="periodic.js"></script>
  <script>
    if (window.TOOLS && window.TOOLS.periodic) {
      window.TOOLS.periodic.render(document.getElementById('main-content'));
      
      setTimeout(() => {
        const head = document.querySelector('.pagehead');
        if(head) head.classList.add('animate__animated', 'animate__slideInDown');
        
        const bar = document.querySelector('.pt-bar');
        if(bar) bar.classList.add('animate__animated', 'animate__fadeInUp');
      }, 50);
    }
  </script>
</body>
</html>
